name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, doctor-node-hermes-ephemeral]
    steps:
      - uses: actions/checkout@v4
      # Runner self-hosted avec volume de cache persistant (ci-worker-orchestrator,
      # `CI_CACHE_DIR`) : store pnpm, cache npm et navigateurs Playwright y sont déjà,
      # donc on saute les caches GitHub (lents depuis les Mac). Sans volume :
      # comportement inchangé.
      - name: Cache local du runner ?
        id: cicache
        shell: bash
        run: |
          if [ -n "${CI_CACHE_DIR:-}" ] && [ -d "$CI_CACHE_DIR" ] && [ -w "$CI_CACHE_DIR" ]; then
            echo "local=true" >> "$GITHUB_OUTPUT"
            echo "Volume de cache local : $CI_CACHE_DIR"
          else
            echo "local=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.cicache.outputs.local != 'true' && 'npm' || '' }}
      - run: npm ci
      - run: npm run check
      - run: node dist/cli.js --version
      - run: npm pack --dry-run
      - name: Verify packaged CLI and API
        run: |
          set -euo pipefail
          tarball=$(npm pack --silent)
          tmp=$(mktemp -d)
          npm --prefix "$tmp" init -y >/dev/null
          npm --prefix "$tmp" install "$PWD/$tarball" >/dev/null
          "$tmp/node_modules/.bin/doctor-node" --version
          (cd "$tmp" && node --input-type=module -e "import('doctor-node').then((module) => { if (typeof module.scan !== 'function') process.exit(1) })")
